# =============================================================================
# Database Daily - Production Episode Publication Workflow
# =============================================================================
#
# ARCHITECTURE — TWO JOBS
# ────────────────────────
# Job 1 (preflight):
#   Resolve episode date. Idempotency check.
#   For SCHEDULE runs: if the episode already exists, set skip=true and exit 0.
#   For DISPATCH runs: if the episode already exists, exit 1 (refuse to overwrite).
#   Outputs: skip (true|false), episode_date (YYYY-MM-DD)
#
# Job 2 (publish):
#   needs: preflight
#   if: skip != 'true'
#   Research → generate script → render HTML digest → validate → send email →
#   commit main → push
#
# IDEMPOTENCY BEHAVIOR
# ────────────────────
# SCHEDULE  + episode already exists  → skip=true, workflow succeeds (no-op)
# SCHEDULE  + episode does not exist  → full pipeline runs
# DISPATCH  + episode already exists  → workflow fails immediately (refuse to overwrite)
# DISPATCH  + episode does not exist  → full pipeline runs
#
# FAIL-SAFE
# ─────────
# Nothing is committed until ALL of the following succeed in Job 2:
#   1. Automated research + script generation
#   2. HTML digest rendering
#   3. Secret scan
#   4. Complete pytest suite
#   5. Email actually sent via the Resend API
# Only then: git commit → git push.
#
# SCHEDULE
# ────────
# Weekly — every Monday 08:00 America/Argentina/Buenos_Aires
#
# CONCURRENCY
# ───────────
# The 'production-episode-publish' group ensures only one production run
# executes at a time. A second trigger queues rather than cancels.
# =============================================================================

name: Publish Episode (Production)

on:
  workflow_dispatch:
    inputs:
      episode_date:
        description: "Episode date (YYYY-MM-DD) — leave blank to use today (Buenos Aires)"
        required: false
        type: string
        default: ""
      episode_title:
        description: "Episode title — optional, overrides the auto-generated title"
        required: false
        type: string
        default: ""
      episode_script:
        description: "Full digest text — leave blank to use automated research"
        required: false
        type: string
        default: ""
  schedule:
    # Every Monday at 08:00 Buenos Aires time
    - cron: '0 8 * * 1'
      timezone: "America/Argentina/Buenos_Aires"

concurrency:
  group: production-episode-publish
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Resolve date, check idempotency, decide whether to proceed
  # ===========================================================================
  preflight:
    name: "Preflight: resolve date and idempotency check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      episode_date: ${{ steps.check.outputs.episode_date }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main

      # Resolve date, check for existing episode, write skip/episode_date outputs.
      # For schedule events: existing episode → skip=true, exit 0 (no-op).
      # For dispatch events: existing episode → exit 1 (refuse to overwrite).
      - name: Resolve date and check idempotency
        id: check
        env:
          EPISODE_DATE: ${{ inputs.episode_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/preflight.py

  # ===========================================================================
  # Job 2: Generate episode, validate, send email, commit and push
  # ===========================================================================
  publish:
    name: "Research, generate, validate, email, and push episode"
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push episode commit to main

    env:
      EPISODE_DATE: ${{ needs.preflight.outputs.episode_date }}
      EPISODE_TITLE_OVERRIDE: ${{ inputs.episode_title }}
      GENERATED_DIR: /tmp/episode_generated

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout main
      # -----------------------------------------------------------------------
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main

      # -----------------------------------------------------------------------
      # 2. Git identity (needed to commit from within the workflow)
      # -----------------------------------------------------------------------
      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # -----------------------------------------------------------------------
      # 3. Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-research.txt

      # -----------------------------------------------------------------------
      # 4. Research and generate episode digest
      #    - If EPISODE_SCRIPT input is set: use it directly (no API call).
      #    - Otherwise: fetch RSS feeds and generate the digest via Claude API.
      #    Writes script.txt and sources.json to $GENERATED_DIR.
      # -----------------------------------------------------------------------
      - name: Research and generate episode digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EPISODE_SCRIPT: ${{ inputs.episode_script }}
        run: |
          mkdir -p "${GENERATED_DIR}"
          python scripts/research_generate.py \
            --date "${EPISODE_DATE}" \
            --output-dir "${GENERATED_DIR}"

      # -----------------------------------------------------------------------
      # 5. Resolve episode title and number, stage episode directory
      # -----------------------------------------------------------------------
      - name: Stage episode directory
        run: |
          python3 << 'PYEOF'
          import json, os
          from pathlib import Path

          date_str  = os.environ["EPISODE_DATE"].strip()
          override  = os.environ.get("EPISODE_TITLE_OVERRIDE", "").strip()
          generated = Path(os.environ["GENERATED_DIR"])
          episodes_dir = Path("episodes")

          sources = json.loads((generated / "sources.json").read_text(encoding="utf-8"))
          title = override or sources.get("episode_title") or f"Database Daily – {date_str}"

          episode_dir = episodes_dir / date_str
          episode_dir.mkdir(parents=True, exist_ok=True)

          # episode_dir now exists, so counting all episode directories
          # (including today's) gives this episode's 1-based position.
          episode_number = len([d for d in episodes_dir.iterdir() if d.is_dir()])

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"EPISODE_TITLE_RESOLVED={title}\n")
              f.write(f"EPISODE_NUMBER={episode_number}\n")

          print(f"Episode #{episode_number}: {title}")
          PYEOF

      # -----------------------------------------------------------------------
      # 6. Render the digest as a self-contained HTML email
      # -----------------------------------------------------------------------
      - name: Render HTML digest
        run: |
          python scripts/generate_email_html.py \
            --script-file  "${GENERATED_DIR}/script.txt" \
            --sources-file "${GENERATED_DIR}/sources.json" \
            --output       "${GENERATED_DIR}/episode.html"

      # -----------------------------------------------------------------------
      # 7. Secret scan — must be clean before sending or committing
      # -----------------------------------------------------------------------
      - name: Run secret scanner
        run: python scripts/scan_secrets.py

      # -----------------------------------------------------------------------
      # 8. Full test suite — must be green before sending or committing
      # -----------------------------------------------------------------------
      - name: Run full test suite
        run: pytest tests/ -v --tb=short

      # ═══════════════════════════════════════════════════════════════════════
      # ALL VALIDATIONS PASSED
      # Send the email first, then commit and push main. If sending fails,
      # nothing is committed — the episode is not recorded as published.
      # ═══════════════════════════════════════════════════════════════════════

      # -----------------------------------------------------------------------
      # 9. Send the digest by email
      # -----------------------------------------------------------------------
      - name: Send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          python scripts/send_email.py \
            --html-file   "${GENERATED_DIR}/episode.html" \
            --script-file "${GENERATED_DIR}/script.txt" \
            --subject     "Database Daily - ${EPISODE_DATE} - ${EPISODE_TITLE_RESOLVED}"

      # -----------------------------------------------------------------------
      # 10. Copy the rendered HTML into the episode directory for the audit
      #     trail, then commit episode files and push to main.
      # -----------------------------------------------------------------------
      - name: Commit and push to main
        run: |
          cp "${GENERATED_DIR}/script.txt"   "episodes/${EPISODE_DATE}/script.txt"
          cp "${GENERATED_DIR}/sources.json"  "episodes/${EPISODE_DATE}/sources.json"
          cp "${GENERATED_DIR}/episode.html"  "episodes/${EPISODE_DATE}/episode.html"

          git add "episodes/${EPISODE_DATE}/"

          python3 -c "
          import os
          date  = os.environ['EPISODE_DATE']
          title = os.environ['EPISODE_TITLE_RESOLVED']
          num   = os.environ['EPISODE_NUMBER']
          msg = (
              f'episode: add {date}\n\n'
              f'Title   : {title}\n'
              f'Episode : #{num}\n\n'
              'Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>'
          )
          with open('/tmp/commit_msg.txt', 'w', encoding='utf-8') as f:
              f.write(msg)
          "

          git commit -F /tmp/commit_msg.txt
          git push origin main
          echo "Pushed: episode ${EPISODE_DATE} (Episode #${EPISODE_NUMBER}) to main"

      # -----------------------------------------------------------------------
      # 11. Publish summary
      # -----------------------------------------------------------------------
      - name: Print episode summary
        run: |
          echo ""
          echo "====== EPISODE SENT AND COMMITTED TO MAIN ======"
          echo "Date     : ${EPISODE_DATE}"
          echo "Title    : ${EPISODE_TITLE_RESOLVED}"
          echo "Episode  : #${EPISODE_NUMBER}"
          echo "================================================="
